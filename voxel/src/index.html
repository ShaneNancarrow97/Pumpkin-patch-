<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#130f1b">
<title>Pumpkin Patch · Voxel</title>
<style>/* @build:style */</style>
</head>
<body>
<canvas id="world" aria-label="A voxel pumpkin farm at night, with Shane, Natalie, Skyla the cat and visiting monsters"></canvas>
<div id="fx" aria-hidden="true"></div>

<header class="hud" id="hud">
  <div class="hud-stats" role="group" aria-label="Farm statistics">
    <div class="hud-stat"><span class="coin-icon" aria-hidden="true"></span><span><small>Coins</small><strong id="coins">£40</strong></span></div>
    <div class="hud-stat"><span class="crate-icon" aria-hidden="true"></span><span><small>Stock</small><strong id="stock">0</strong></span></div>
    <div class="hud-stat"><span class="ghost-icon" aria-hidden="true"></span><span><small>Visitors</small><strong id="sold">0</strong></span></div>
  </div>
  <button class="icon-button" id="open-settings" aria-label="Settings"><span class="gear-icon" aria-hidden="true"></span></button>
  <div class="hud-level" id="hud-level"><span class="sr">Patch level: </span><span class="sr" id="level-name">Little seed</span><i><b id="level-bar"></b></i></div>
</header>

<button class="goal-chip" id="goal"><span class="goal-star" aria-hidden="true">✦</span><span id="goal-text">A basket for a ghost</span></button>
<div class="streak" id="streak" hidden></div>
<div class="paused" id="paused" hidden>Tea break</div>
<div class="notice" id="notice" role="status" aria-live="polite"></div>
<div class="bubble" id="bubble" hidden></div>
<button class="dialogue" id="dialogue" hidden aria-live="polite"><span class="dialogue-portrait" aria-hidden="true"></span><span class="dialogue-words"><span class="dialogue-name"></span><span class="dialogue-text"></span></span></button>

<div class="place-bar" id="place-bar" hidden>
  <button class="button" id="place-back" aria-label="Back to the patch"><span class="ico i-patch" aria-hidden="true"></span><span class="place-back-text">Back to the patch</span></button>
  <h2 id="place-title"></h2>
  <button class="button gold" id="place-decorate">Decorate</button>
</div>
<div class="piece-bar" id="piece-bar" hidden></div>

<div class="actions" id="actions">
  <button class="action" id="plant-all"><span class="ico i-plant" aria-hidden="true"></span>Plant <b id="plant-count">6</b></button>
  <button class="action" id="boost"><span class="ico i-boost" aria-hidden="true"></span>Boost</button>
  <button class="action gold" id="harvest-all"><span class="ico i-harvest" aria-hidden="true"></span>Harvest <b id="harvest-count">0</b></button>
</div>

<nav class="dock" id="dock" aria-label="Main navigation">
  <button class="tab active" data-tab="patch" aria-pressed="true"><span class="tab-icon patch" aria-hidden="true"></span>Patch</button>
  <button class="tab" data-tab="shop" aria-pressed="false"><span class="tab-icon shop" aria-hidden="true"></span>Shop</button>
  <button class="tab" data-tab="home" aria-pressed="false"><span class="tab-icon home" aria-hidden="true"></span>Home</button>
  <button class="tab" data-tab="wardrobe" aria-pressed="false"><span class="tab-icon wardrobe" aria-hidden="true"></span>Wardrobe</button>
  <button class="tab" data-tab="journal" aria-pressed="false"><span class="tab-icon journal" aria-hidden="true"></span>Journal<i class="badge" id="journal-badge" hidden></i></button>
</nav>

<section class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheet-title" hidden>
  <div class="sheet-frame">
    <span class="bat bat-left" aria-hidden="true"></span><span class="bat bat-right" aria-hidden="true"></span>
    <header class="sheet-head">
      <div><p class="eyebrow" id="sheet-eyebrow"></p><h2 id="sheet-title"></h2></div>
      <button class="icon-button close" id="sheet-close" aria-label="Close">×</button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</section>

<script>/* @build:script */</script>
</body>
</html>
