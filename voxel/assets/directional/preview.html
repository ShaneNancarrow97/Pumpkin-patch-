<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Directional character proof</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#211a2d;color:#f4e5c8;font:16px system-ui}h1{font-size:24px}button,select,input{font:inherit;min-height:44px}button,select{background:#463250;color:inherit;border:1px solid #927257;border-radius:10px;padding:8px}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-top:24px}article{padding:14px;border:1px solid #6c526a;border-radius:14px;text-align:center}canvas{display:block;margin:auto;width:128px;height:176px;background:linear-gradient(transparent 163px,#bd9260 164px,transparent 165px)}small{display:block;margin-top:8px;color:#d0b9d9}a{color:#f3bd70}</style>
<h1>Directional character proof</h1><p>One scale per character. Amber line marks the shared floor. Check both feet, hands, silhouette and true facing at every step.</p><header><label>Direction <select id="direction"></select></label><button id="play">Pause</button><label>Step <input id="step" type="range" min="0" max="7" value="0"></label><label>Speed <select id="speed"><option value="4">4 fps</option><option value="8" selected>8 fps</option><option value="12">12 fps</option></select></label><output id="phase"></output></header><main class="cards" id="cards"></main>
<script>const cast=[{"id": "shane-base", "file": "shane-base.webp", "directions": ["front", "frontRight", "right", "backRight", "back", "backLeft", "left", "frontLeft"], "locomotion": "walk"}, {"id": "natalie-base", "file": "natalie-base.webp", "directions": ["front", "frontRight", "right", "backRight", "back", "backLeft", "left", "frontLeft"], "locomotion": "walk"}, {"id": "elowen", "file": "elowen.webp", "directions": ["front", "frontRight", "right", "backRight", "back", "backLeft", "left", "frontLeft"], "locomotion": "walk"}, {"id": "rowan", "file": "rowan.webp", "directions": ["front", "frontRight", "right", "backRight", "back", "backLeft", "left", "frontLeft"], "locomotion": "walk"}, {"id": "vesper", "file": "vesper.webp", "directions": ["front", "frontRight", "right", "backRight", "back", "backLeft", "left", "frontLeft"], "locomotion": "walk"}, {"id": "mabel", "file": "mabel.webp", "directions": ["front", "frontRight", "right", "backRight", "back", "backLeft", "left", "frontLeft"], "locomotion": "walk"}, {"id": "tansy", "file": "tansy.webp", "directions": ["front", "frontRight", "right", "backRight", "back", "backLeft", "left", "frontLeft"], "locomotion": "walk"}, {"id": "opal", "file": "opal.webp", "directions": ["front", "frontRight", "right", "backRight", "back", "backLeft", "left", "frontLeft"], "locomotion": "walk"}, {"id": "cinder", "file": "cinder.webp", "directions": ["front", "frontRight", "right", "backRight", "back", "backLeft", "left", "frontLeft"], "locomotion": "float"}, {"id": "corvus", "file": "corvus.webp", "directions": ["front", "frontRight", "right", "backRight", "back", "backLeft", "left", "frontLeft"], "locomotion": "walk"}, {"id": "baron", "file": "baron.webp", "directions": ["front", "frontRight", "right", "backRight", "back", "backLeft", "left", "frontLeft"], "locomotion": "walk"}],dirs=["front", "frontRight", "right", "backRight", "back", "backLeft", "left", "frontLeft"],phases=["left-contact", "left-down", "right-passing", "right-up", "right-contact", "right-down", "left-passing", "left-up"];const select=document.getElementById('direction'),step=document.getElementById('step'),play=document.getElementById('play');dirs.forEach((d,i)=>select.add(new Option(d,i)));let running=true,age=0,last=0;const views=cast.map(c=>{const card=document.createElement('article'),heading=document.createElement('h2'),canvas=document.createElement('canvas'),note=document.createElement('small'),link=document.createElement('a');heading.textContent=c.id;canvas.width=128;canvas.height=176;note.textContent='8 directions · 8 '+(c.locomotion==='float'?'floating':'walking')+' phases';link.href=c.id+'-contact.jpg';link.textContent='View all 64 frames';card.append(heading,canvas,note,link);document.getElementById('cards').append(card);const image=new Image();image.src=c.file;return {...c,image,ctx:canvas.getContext('2d')};});play.onclick=()=>{running=!running;play.textContent=running?'Pause':'Play'};step.oninput=()=>{running=false;play.textContent='Play';age=+step.value};function draw(now){if(last&&running)age+=(now-last)/1000*+document.getElementById('speed').value;last=now;const col=Math.floor(age)%8;step.value=col;document.getElementById('phase').textContent=phases[col];views.forEach(v=>{v.ctx.clearRect(0,0,128,176);if(v.image.complete&&v.image.naturalWidth){const row=v.directions.indexOf(dirs[+select.value]);v.ctx.drawImage(v.image,col*128,row*176,128,176,0,0,128,176)}});requestAnimationFrame(draw)}requestAnimationFrame(draw);</script></html>
